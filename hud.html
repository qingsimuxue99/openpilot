<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no'>
<title>赛博驾驶报告 · 晚風的OP工具箱</title>
<style>
:root{
  --bg:#f5f2ec;--bg2:#ffffff;--bg3:#f9f7f3;
  --ink:#2d2d2d;--muted:#8a8690;--dim:#c5c0ba;
  --accent:#1aab8a;--accent2:#e85d50;--accent3:#4a90d9;
  --rule:#e8e4dd;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#eef6f3 0%,#f5f2ec 60%);color:var(--ink);min-height:100vh;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-size:18px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.panel{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.panel h3{font-size:13px;letter-spacing:1px;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.panel h3::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px}
.rep-stage{background:var(--bg3);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;justify-content:center}
#repCanvas{box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:8px;max-width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--rule);background:var(--bg3);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{border-color:var(--accent);background:#fff}
.btn.alt{border-color:var(--accent);background:var(--accent);color:#fff}
.btn.alt:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--accent2);background:var(--accent2);color:#fff}
.btn.warn:hover{filter:brightness(1.08)}
.tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(45,45,45,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class='wrap'>
  <div class='top'><span class='logo'>📊 晚風的OP工具箱 · 驾驶报告</span></div>
  <div class='panel'>
    <h3>赛博驾驶报告 · 分享卡片</h3>
    <div class='rep-stage'>
      <canvas id='repCanvas' width='360' height='560'></canvas>
    </div>
    <div class='btns'>
      <button class='btn alt' onclick='startRec()'>▶ 开始统计本次行程</button>
      <button class='btn warn' onclick='stopRec()'>⏸ 停止统计</button>
      <button class='btn' onclick='genReport()'>🎨 生成报告卡片</button>
      <button class='btn' onclick='dlReport()'>⬇ 保存图片</button>
    </div>
    <div class='tip' id='repTip'>点「开始统计本次行程」，行驶一会儿，再点「生成报告卡片」。卡片可保存发朋友圈装逼。</div>
  </div>
</div>
<div id='toast'></div>

<script>
var recTimer=null, recOn=false, samples=[], recStart=0;

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show')},2600);
}

/* 持续拉取 /api/hud 仅为采集行程采样（记录开启时） */
async function poll(){
  try{
    var d=await (await fetch('/api/hud')).json();
    if(recOn && d) samples.push({t:Date.now(),spd:d.speed,steer:Math.abs(d.steer),acc:Math.abs(d.accel)});
  }catch(e){}
}
function startHud(){ if(recTimer) return; poll(); recTimer=setInterval(poll,500); }
function stopHud(){ if(recTimer){clearInterval(recTimer);recTimer=null;} }

function startRec(){
  samples=[]; recOn=true; recStart=Date.now();
  toast('已开始统计本次行程');
  document.getElementById('repTip').textContent='统计中… 行驶一会儿后点「生成报告卡片」。';
}
function stopRec(){ recOn=false; toast('已停止统计'); }

/* 浅色主题卡片底图（与整体工具箱主题一致） */
function drawCardBg(x,W,H){
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(1,'#f3f0ea');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle='#1aab8a'; x.lineWidth=2; x.strokeRect(8,8,W-16,H-16);
  x.fillStyle='#1aab8a'; x.fillRect(8,8,W-16,4);
}

function drawEmptyRep(){
  var c=document.getElementById('repCanvas'); if(!c) return;
  var x=c.getContext('2d'),W=c.width,H=c.height;
  drawCardBg(x,W,H);
  x.fillStyle='#1aab8a'; x.textAlign='center'; x.font='800 24px sans-serif'; x.fillText('DRIVE REPORT',W/2,60);
  x.fillStyle='#8a8690'; x.font='12px sans-serif'; x.fillText('晚風的OP工具箱',W/2,82);
  x.fillStyle='#e85d50'; x.font='13px sans-serif'; x.fillText('暂无数据，请先点「开始统计本次行程」',W/2,300);
}

function genReport(){
  var c=document.getElementById('repCanvas'); if(!c) return;
  var x=c.getContext('2d'),W=c.width,H=c.height;
  drawCardBg(x,W,H);
  x.fillStyle='#1aab8a'; x.textAlign='center'; x.font='800 24px sans-serif'; x.fillText('DRIVE REPORT',W/2,60);
  x.fillStyle='#8a8690'; x.font='12px sans-serif'; x.fillText('晚風的OP工具箱 · '+new Date().toLocaleDateString(),W/2,82);
  if(!samples.length){ x.fillStyle='#e85d50'; x.fillText('暂无数据，请先开始统计',W/2,300); return; }
  var dist=0, dur=(samples[samples.length-1].t-samples[0].t)/1000, maxSpd=0, sumS=0, sumA=0;
  for(var i=0;i<samples.length;i++){
    var s=samples[i];
    if(i>0) dist+=(s.spd/3600)*((s.t-samples[i-1].t)/1000);
    if(s.spd>maxSpd) maxSpd=s.spd;
    sumS+=s.steer; sumA+=s.acc;
  }
  var avgS=sumS/samples.length, avgA=sumA/samples.length;
  var smooth=Math.max(0,Math.min(100,100-avgA*40-avgS*0.15));
  var rows=[
    ['里程 🛣️', dist.toFixed(2)+' km'],
    ['时长 ⏱️', fmtDur(dur)],
    ['最高车速 🏎️', maxSpd.toFixed(0)+' km/h'],
    ['平均转向 🧭', avgS.toFixed(1)+'°'],
    ['平滑度评分 ✨', smooth.toFixed(0)+' / 100']
  ];
  var y=140;
  rows.forEach(function(r){
    x.textAlign='left';  x.fillStyle='#8a8690'; x.font='13px sans-serif'; x.fillText(r[0],40,y);
    x.textAlign='right'; x.fillStyle='#2d2d2d'; x.font='800 20px sans-serif'; x.fillText(r[1],W-40,y+4);
    x.strokeStyle='#ece8e0'; x.lineWidth=1; x.beginPath(); x.moveTo(40,y+14); x.lineTo(W-40,y+14); x.stroke();
    y+=52;
  });
  x.textAlign='center';
  var grade=smooth>=80?'S级 · 老司机':smooth>=60?'A级 · 稳健':smooth>=40?'B级 · 熟练':'C级 · 生猛';
  x.fillStyle=smooth>=60?'#1aab8a':'#e85d50'; x.font='800 22px sans-serif';
  x.fillText(grade,W/2,H-50);
  document.getElementById('repTip').textContent='已生成 '+samples.length+' 个采样点，可保存图片分享。';
  toast('报告已生成');
}
function fmtDur(s){ var m=Math.floor(s/60), sec=Math.floor(s%60); return m+'分'+sec+'秒'; }
function dlReport(){
  var c=document.getElementById('repCanvas');
  if(!c){ toast('请先生成'); return; }
  var a=document.createElement('a');
  a.href=c.toDataURL('image/png'); a.download='drive_report.png';
  document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},500);
}

drawEmptyRep();
startHud();
</script>
</body>
</html>
