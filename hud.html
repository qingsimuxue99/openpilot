<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no'>
<title>赛博 HUD · 晚風的OP工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#0c1830 0%,#05080f 65%);color:#cfe9ff;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,200,255,.035) 3px 4px);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:18px 16px 40px}
/* Top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-size:18px;font-weight:800;letter-spacing:3px;color:#5fe0ff;text-shadow:0 0 14px rgba(0,200,255,.6)}
.tabs{margin-left:auto;display:flex;gap:6px;background:rgba(0,20,40,.5);border:1px solid #16324f;border-radius:24px;padding:4px}
.tab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:#5b87b0;transition:.2s}
.tab.on{background:linear-gradient(135deg,#00e0ff,#1aff8c);color:#021018;box-shadow:0 0 16px rgba(0,200,255,.5)}
/* Status chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid #1f4068;color:#7fd4ff;background:rgba(0,120,200,.08);letter-spacing:1px}
.chip.on{color:#7CFFB2;border-color:#1f6b45;background:rgba(0,200,120,.12);box-shadow:0 0 12px rgba(0,200,120,.35)}
.chip.demo{color:#ffd25f;border-color:#6b5a1f;background:rgba(255,200,0,.1)}
/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
.panel{background:rgba(0,16,34,.55);border:1px solid #16324f;border-radius:14px;padding:14px;position:relative;overflow:hidden}
.panel::after{content:'';position:absolute;top:-40%;left:-40%;width:180%;height:180%;background:radial-gradient(circle,rgba(0,180,255,.05),transparent 60%);pointer-events:none;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel h3{font-size:11px;letter-spacing:2px;color:#5b87b0;text-transform:uppercase;margin-bottom:8px;position:relative;z-index:2}
canvas{display:block;max-width:100%;position:relative;z-index:2}
.gauge-wrap,.car-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* Stat cells */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cell{background:rgba(0,16,34,.6);border:1px solid #16324f;border-radius:10px;padding:10px 12px;position:relative;z-index:2}
.cell .k{font-size:9px;color:#5b87b0;letter-spacing:1px;text-transform:uppercase}
.cell .v{font-size:19px;font-weight:800;color:#8be9ff;font-family:'Cascadia Code',monospace;margin-top:2px}
.bar{height:9px;border-radius:6px;background:#0a1a2c;overflow:hidden;margin-top:8px;border:1px solid #16324f}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .25s}
.bar.g>i{background:linear-gradient(90deg,#1aff8c,#0f9)}
.bar.b>i{background:linear-gradient(90deg,#ff5f6d,#ff2d55)}
/* Buttons */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:2}
.btn{padding:9px 16px;border-radius:9px;border:1px solid #1f4d75;background:#0c2a44;color:#8be9ff;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{border-color:#5fe0ff;background:#10395c;box-shadow:0 0 12px rgba(0,200,255,.3)}
.btn.alt{border-color:#1f6b45;background:#0c2a1c;color:#7CFFB2}
.btn.alt:hover{border-color:#7CFFB2}
.tip{font-size:11px;color:#5b87b0;margin-top:12px;line-height:1.6;position:relative;z-index:2}
/* Report */
.rep-stage{background:#05080f;border:1px solid #16324f;border-radius:12px;padding:14px;display:flex;justify-content:center;position:relative;z-index:2}
#repCanvas{box-shadow:0 0 36px rgba(0,180,255,.25);border-radius:8px}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(8,20,36,.95);border:1px solid #1f4d75;color:#8be9ff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class='wrap'>
  <div class='top'>
    <span class='logo'>⚡ OP HUD</span>
    <div class='tabs'>
      <div class='tab on' id='tabHud' onclick='switchTab("hud")'>仪表盘</div>
      <div class='tab' id='tabRep' onclick='switchTab("report")'>驾驶报告</div>
    </div>
  </div>

  <!-- HUD 页 -->
  <div id='viewHud'>
    <div class='chips'>
      <span class='chip' id='mMode'>连接中…</span>
      <span class='chip' id='mState'>STANDBY</span>
      <span class='chip' id='mGear'>G:N</span>
    </div>
    <div class='grid'>
      <div class='panel gauge-wrap'>
        <h3>速度 SPEED</h3>
        <canvas id='gauge' width='300' height='300'></canvas>
      </div>
      <div class='panel car-wrap'>
        <h3>车辆姿态 VEHICLE</h3>
        <canvas id='car' width='300' height='240'></canvas>
        <div style='font-size:10px;color:#5b87b0;margin-top:6px;letter-spacing:1px;position:relative;z-index:2'>实时 3D 车模 · 随转向/加减速联动</div>
      </div>
    </div>
    <div class='panel' style='margin-top:14px'>
      <h3>实时参数 TELEMETRY</h3>
      <div class='stats'>
        <div class='cell'><div class='k'>加速度 a (m/s²)</div><div class='v' id='vAcc'>0.00</div></div>
        <div class='cell'><div class='k'>转向角 (°)</div><div class='v' id='vSteer'>0.0</div></div>
        <div class='cell' style='grid-column:1/3'>
          <div class='k'>油门 / 刹车</div>
          <div class='bar g'><i id='bGas' style='width:0%'></i></div>
          <div class='bar b'><i id='bBrake' style='width:0%'></i></div>
        </div>
        <div class='cell'><div class='k'>CPU 温度 (°C)</div><div class='v' id='vCpu'>--</div></div>
        <div class='cell'><div class='k'>网络 / 磁盘</div><div class='v' id='vNet'>--</div></div>
      </div>
      <div class='btns'>
        <button class='btn alt' onclick='startRec()'>▶ 开始统计本次行程</button>
        <button class='btn' onclick='stopRec()'>⏸ 停止统计</button>
      </div>
      <div class='tip' id='hudTip'>开车时打开此页即可看实时 HUD。若顶部显示 DEMO，说明设备暂未取到真实车况（openpilot 未运行或环境限制），仪表仍会动但为模拟数据。</div>
    </div>
  </div>

  <!-- 报告页 -->
  <div id='viewRep' class='hide'>
    <div class='panel'>
      <h3>赛博驾驶报告 · 分享卡片</h3>
      <div class='rep-stage'>
        <canvas id='repCanvas' width='360' height='560'></canvas>
      </div>
      <div class='btns'>
        <button class='btn alt' onclick='genReport()'>🎨 生成报告卡片</button>
        <button class='btn' onclick='dlReport()'>⬇ 保存图片</button>
      </div>
      <div class='tip' id='repTip'>先在「仪表盘」页点「开始统计本次行程」，行驶一会儿，再回来生成卡片。卡片可保存发朋友圈装逼。</div>
    </div>
  </div>
</div>
<div id='toast'></div>

<script>
var hudTimer=null, hudData=null;
var recOn=false, samples=[], recStart=0;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2600);}

function switchTab(name){
  if(name==='report'){document.getElementById('viewHud').classList.add('hide');document.getElementById('viewRep').classList.remove('hide');document.getElementById('tabHud').classList.remove('on');document.getElementById('tabRep').classList.add('on');}
  else{document.getElementById('viewRep').classList.add('hide');document.getElementById('viewHud').classList.remove('hide');document.getElementById('tabRep').classList.remove('on');document.getElementById('tabHud').classList.add('on');}
  if(name==='report') drawEmptyRep();
}
// 初始根据 hash 切 tab
if(location.hash==='#report') switchTab('report');

function startHud(){ if(hudTimer)return; tick(); hudTimer=setInterval(tick,500); }
function stopHud(){ if(hudTimer){clearInterval(hudTimer);hudTimer=null;} }
async function tick(){
  try{
    var d=await (await fetch('/api/hud')).json();
    hudData=d; render(d);
    if(recOn && d) samples.push({t:Date.now(),spd:d.speed,steer:Math.abs(d.steer),acc:Math.abs(d.accel)});
  }catch(e){}
}
function render(d){
  var m=document.getElementById('mMode');
  if(d.demo){m.textContent='DEMO 演示';m.className='chip demo';}
  else{m.textContent='LIVE 实时';m.className='chip on';}
  var st=document.getElementById('mState');
  if(d.enabled&&d.active){st.textContent='AUTOPILOT ON';st.className='chip on';}
  else if(d.enabled){st.textContent='ENGAGED';st.className='chip';}
  else{st.textContent='STANDBY';st.className='chip';}
  document.getElementById('mGear').textContent='G:'+d.gear;
  document.getElementById('vAcc').textContent=(d.accel>=0?'+':'')+d.accel.toFixed(2);
  document.getElementById('vSteer').textContent=d.steer.toFixed(1);
  document.getElementById('bGas').style.width=Math.min(100,d.gas*100)+'%';
  document.getElementById('bBrake').style.width=Math.min(100,d.brake*100)+'%';
  document.getElementById('vCpu').textContent=d.cpuTemp!=null?d.cpuTemp.toFixed(0):'--';
  var net=['','WiFi','蜂窝','WiFi?'][d.network]||('N'+d.network);
  document.getElementById('vNet').textContent=net+' · '+d.freeSpace+'%';
  drawGauge(d.speed); drawCar(d.steer,d.accel,d.speed);
}
function drawGauge(spd){
  var c=document.getElementById('gauge'),x=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2,R=120;
  x.clearRect(0,0,W,H);
  x.lineWidth=10;x.strokeStyle='#0e2a44';x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
  var max=160, a=Math.min(1,spd/max)*Math.PI*1.5-Math.PI*0.75;
  var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#00e0ff');g.addColorStop(1,'#7CFFB2');
  x.lineWidth=10;x.strokeStyle=g;x.beginPath();x.arc(cx,cy,R,-Math.PI*0.75,a);x.stroke();
  x.strokeStyle='#1f4d75';x.lineWidth=2;
  for(var i=0;i<=max;i+=20){var an=-Math.PI*0.75+(i/max)*Math.PI*1.5;x.beginPath();x.moveTo(cx+Math.cos(an)*(R-16),cy+Math.sin(an)*(R-16));x.lineTo(cx+Math.cos(an)*(R-6),cy+Math.sin(an)*(R-6));x.stroke();}
  x.fillStyle='#eaffff';x.textAlign='center';x.font='800 46px Cascadia Code, monospace';x.shadowColor='#00e0ff';x.shadowBlur=18;
  x.fillText(spd.toFixed(0),cx,cy+4);x.shadowBlur=0;
  x.fillStyle='#5b87b0';x.font='12px sans-serif';x.fillText('km/h',cx,cy+28);
}
function drawCar(steer,acc,spd){
  var c=document.getElementById('car'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  x.save();x.translate(W/2,H/2+24);
  x.translate(0,Math.max(-6,Math.min(6,-acc*2)));
  x.strokeStyle='rgba(0,180,255,.15)';x.lineWidth=1;
  for(var gx=-130;gx<=130;gx+=22){x.beginPath();x.moveTo(gx,-60);x.lineTo(gx*0.4,46);x.stroke();}
  x.fillStyle='#0c3a5e';x.strokeStyle='#5fe0ff';x.lineWidth=2;
  x.beginPath();x.moveTo(-52,-8);x.lineTo(52,-8);x.lineTo(44,22);x.lineTo(-44,22);x.closePath();x.fill();x.stroke();
  x.fillStyle='#0a2c47';x.beginPath();x.moveTo(-28,-8);x.lineTo(28,-8);x.lineTo(20,-34);x.lineTo(-20,-34);x.closePath();x.fill();x.stroke();
  var sa=steer/180*0.8;
  function wheel(wx,wy){x.save();x.translate(wx,wy);x.rotate(sa);x.fillStyle='#10283d';x.strokeStyle='#8be9ff';x.lineWidth=2;x.beginPath();x.ellipse(0,0,8,13,0,0,Math.PI*2);x.fill();x.stroke();x.restore();}
  wheel(-34,-12);wheel(34,-12);wheel(-34,24);wheel(34,24);
  if(spd>5){x.strokeStyle='rgba(124,255,178,'+Math.min(0.6,spd/160)+')';x.lineWidth=3;x.beginPath();x.moveTo(-30,30);x.lineTo(-30-spd*0.32,30);x.moveTo(30,30);x.lineTo(30+spd*0.32,30);x.stroke();}
  x.restore();
}
function startRec(){samples=[];recOn=true;recStart=Date.now();toast('已开始统计本次行程');document.getElementById('repTip').textContent='统计中… 行驶一会儿后回到本页生成卡片。';}
function stopRec(){recOn=false;toast('已停止统计');}
function drawEmptyRep(){
  var c=document.getElementById('repCanvas');if(!c)return;var x=c.getContext('2d'),W=c.width,H=c.height;
  x.fillStyle='#060a12';x.fillRect(0,0,W,H);x.strokeStyle='#00e0ff';x.lineWidth=2;x.strokeRect(8,8,W-16,H-16);
  x.fillStyle='#5fe0ff';x.textAlign='center';x.shadowColor='#00e0ff';x.shadowBlur=14;x.font='800 24px Cascadia Code, monospace';x.fillText('DRIVE REPORT',W/2,60);x.shadowBlur=0;
  x.fillStyle='#5b87b0';x.font='12px sans-serif';x.fillText('晚風的OP工具箱',W/2,82);
  x.fillStyle='#ffd25f';x.font='13px sans-serif';x.fillText('暂无数据，请先在仪表盘页开始统计',W/2,300);
}
function genReport(){
  var c=document.getElementById('repCanvas');if(!c)return;var x=c.getContext('2d'),W=c.width,H=c.height;
  x.fillStyle='#060a12';x.fillRect(0,0,W,H);x.strokeStyle='#00e0ff';x.lineWidth=2;x.strokeRect(8,8,W-16,H-16);
  x.fillStyle='#5fe0ff';x.textAlign='center';x.shadowColor='#00e0ff';x.shadowBlur=14;x.font='800 24px Cascadia Code, monospace';x.fillText('DRIVE REPORT',W/2,60);x.shadowBlur=0;
  x.fillStyle='#5b87b0';x.font='12px sans-serif';x.fillText('晚風的OP工具箱 · '+new Date().toLocaleDateString(),W/2,82);
  if(!samples.length){x.fillStyle='#ffd25f';x.fillText('暂无数据，请先开始统计',W/2,300);return;}
  var dist=0,dur=(samples[samples.length-1].t-samples[0].t)/1000,maxSpd=0,sumS=0,sumA=0;
  for(var i=0;i<samples.length;i++){var s=samples[i];if(i>0)dist+=(s.spd/3600)*((s.t-samples[i-1].t)/1000);if(s.spd>maxSpd)maxSpd=s.spd;sumS+=s.steer;sumA+=s.acc;}
  var avgS=sumS/samples.length,avgA=sumA/samples.length;
  var smooth=Math.max(0,Math.min(100,100-avgA*40-avgS*0.15));
  var rows=[['里程',dist.toFixed(2)+' km'],['时长',fmtDur(dur)],['最高车速',maxSpd.toFixed(0)+' km/h'],['平均转向',avgS.toFixed(1)+'°'],['平滑度评分',smooth.toFixed(0)+' / 100']];
  var y=140;
  rows.forEach(function(r){x.textAlign='left';x.fillStyle='#5b87b0';x.font='13px sans-serif';x.fillText(r[0],40,y);x.textAlign='right';x.fillStyle='#8be9ff';x.font='800 20px Cascadia Code, monospace';x.fillText(r[1],W-40,y+4);x.strokeStyle='#16324f';x.beginPath();x.moveTo(40,y+14);x.lineTo(W-40,y+14);x.stroke();y+=52;});
  x.textAlign='center';x.fillStyle='#7CFFB2';x.font='800 22px Cascadia Code, monospace';
  x.fillText(smooth>=80?'S级 · 老司机':smooth>=60?'A级 · 稳健':smooth>=40?'B级 · 熟练':'C级 · 生猛',W/2,H-50);
  document.getElementById('repTip').textContent='已生成 '+samples.length+' 个采样点，可保存图片分享。';
  toast('报告已生成');
}
function fmtDur(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m+'分'+sec+'秒';}
function dlReport(){var c=document.getElementById('repCanvas');if(!c){toast('请先生成');return;}var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='drive_report.png';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);}

document.addEventListener('visibilitychange',function(){ if(document.hidden) stopHud(); else startHud(); });
startHud();
</script>
</body>
</html>
