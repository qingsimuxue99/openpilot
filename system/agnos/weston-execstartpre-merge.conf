# weston.service 开机加速 drop-in
#
# 作用：把原厂 weston.service 的 8 条 ExecStartPre 合并为 2 条。
#       原厂每条 ExecStartPre 都要单独 fork/exec 一个 /bin/bash（或 /bin/chvt），
#       实测累计约 1.7s；合并后只需 2 个进程，约 0.3s，开机第一屏可缩短约 1.4s。
#
# 原理：8 条命令全部是幂等的启动准备动作（建目录、设权限、写调试开关、切 tty），
#       彼此之间没有依赖关系，可以在同一个 shell 里顺序执行，语义完全等价。
#
# 安装：sudo mkdir -p /etc/systemd/system/weston.service.d
#       sudo cp 本文件 /etc/systemd/system/weston.service.d/10-merge-execstartpre.conf
#       sudo systemctl daemon-reload
#
# 回滚：sudo rm /etc/systemd/system/weston.service.d/10-merge-execstartpre.conf
#       sudo systemctl daemon-reload
#       （不修改 /usr 下任何原厂文件，AGNOS 升级不受影响）
#
# 说明：第 1 条保留独立进程是因为 python 解释器无法并入 bash；
#       原 python 命令外层还包了一层 /bin/bash -c，属多余包装，已去除。
#       /var/tmp/weston 即原厂 Environment 中 XDG_RUNTIME_DIR 的值，此处写死以避免变量展开歧义。

[Service]
# 先清空原厂 ExecStartPre 列表（systemd drop-in 覆盖可重复指令的标准写法）
ExecStartPre=
# 1) tty1 切回文本模式（原第 1 条，去掉多余的 bash 包装）
ExecStartPre=/usr/local/venv/bin/python -c 'import fcntl; KDSETMODE = 0x4B3A; KD_TEXT = 0x00; fd = open("/dev/tty1", "w"); fcntl.ioctl(fd, KDSETMODE, KD_TEXT); fd.close()'
# 2) 其余 7 条在同一 shell 内顺序执行（原第 2-8 条）
ExecStartPre=/bin/bash -c 'mkdir -p /var/tmp/weston && chown -R comma: /var/tmp/weston && chmod -R 700 /var/tmp/weston; mkdir -p /data/misc/display || true; echo 0 > /data/misc/display/sdm_dbg_cfg.txt || true; echo 0 > /data/misc/display/gbm_dbg_cfg.txt || true; /bin/chvt 1'
